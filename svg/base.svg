<svg
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 150 26"
  height="26"
  width="150"
>
  <style>
    text {
      font: 16px monospace;
    }

    #withLoveByHuman {
      font: bold 16px monospace;
    }
  </style>

  <rect
    rx="4"
    width="100%"
    height="100%"
    fill="{bgColor}"
  />

  <text x="1ch" y="18" fill="{textColor_made}">Made</text>

  <text x="1ch" id="withLoveByHuman"><!--

    --><tspan fill="{textColor_withLove}" x="6ch" dy="-4">with ♥</tspan><!--

    --><tspan fill="{textColor_byHuman}" x="6ch" dy="22">by human</tspan><!--

    --><!-- NOTE: '22' cuz need to compensate/adjust for the 'y' letter's "tail" --><!--

    --><animate
      attributeName="y"
      dur="3.5s"
      values="0; 0; 22; 22; 0"
      keyTimes="0; 0.4; 0.5; 0.9; 1"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="
        0.33 1 0.68 1;
        0.33 1 0.68 1;
        0.33 1 0.68 1;
        0.33 1 0.68 1"
    /><!--
  --></text>
</svg>
